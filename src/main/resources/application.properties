spring.application.name=cab-router

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cabrouter}
spring.datasource.username=${DB_USER:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.mvc.problemdetails.enabled=true

# Routing tunables (see RoutingProperties and README)
routing.circuity-factor=1.4
routing.average-speed-kmph=22
routing.dwell-minutes=2
routing.arrival-buffer-minutes=15
routing.departure-buffer-minutes=10
routing.night-start-hour=20
routing.night-end-hour=7
routing.escort-detour-tolerance=0.25
routing.sweep-starts=48
# What a security guard costs for one trip, in the same currency as vehicle prices.
routing.escort-cost=600
routing.default-cab-capacity=4
routing.default-max-ride-minutes=90

# Travel model: haversine (default, no network) or osrm (road network).
# OSRM receives employees' home coordinates, so point it at a server you run
# yourself in production; see the README. OSRM times are free-flow, so they are
# multiplied by duration-factor to allow for traffic.
routing.travel-model=${TRAVEL_MODEL:haversine}
routing.osrm.base-url=${OSRM_URL:http://localhost:5000}
routing.osrm.duration-factor=2.0
routing.osrm.max-table-size=100
routing.osrm.timeout-seconds=10
