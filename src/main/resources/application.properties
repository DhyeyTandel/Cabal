spring.application.name=cab-router

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cabrouter}
spring.datasource.username=${DB_USER:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.mvc.problemdetails.enabled=true

# Routing tunables (see RoutingProperties and README)
routing.circuity-factor=1.4
# Free-flow speed on the haversine model's road-equivalent km. OSRM's measured median
# free-flow speed over the demo points was 46.9 km/h.
routing.free-flow-speed-kmph=45
# How much slower than free-flow each hour is, 00:00 to 23:00, interpolated between
# hours. ILLUSTRATIVE, not measured: the shape of a typical Bengaluru weekday (morning
# and evening peaks, quiet nights). Calibrate from real trip logs before relying on it.
routing.traffic-hourly-factors=1.2,1.2,1.2,1.2,1.2,1.3,1.4,1.8,2.3,2.5,2.2,1.9,1.9,1.9,1.9,1.9,2.1,2.4,2.6,2.4,2.0,1.7,1.4,1.3
routing.dwell-minutes=2
routing.arrival-buffer-minutes=15
routing.departure-buffer-minutes=10
routing.night-start-hour=20
routing.night-end-hour=7
routing.escort-detour-tolerance=0.25
routing.sweep-starts=48
# What a security guard costs for one trip, in the same currency as vehicle prices.
routing.escort-cost=600
routing.default-cab-capacity=4
routing.default-max-ride-minutes=90
routing.max-riders-per-plan=2000

# Travel model: haversine (default, no network) or osrm (road network).
# OSRM receives employees' home coordinates, so point it at a server you run
# yourself in production; see the README. OSRM times are free-flow; the traffic
# profile above is applied on top.
routing.travel-model=${TRAVEL_MODEL:haversine}
routing.osrm.base-url=${OSRM_URL:http://localhost:5000}
routing.osrm.max-table-size=100
routing.osrm.timeout-seconds=10

# Write protection for /api/ (see ApiKeyFilter). Blank means open, which is what local dev,
# tests and the demo script rely on; set CABAL_API_KEY to require the header in production.
cabal.api-key=${CABAL_API_KEY:}
cabal.require-api-key=false
