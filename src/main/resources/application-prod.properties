# Production profile: activated with SPRING_PROFILES_ACTIVE=prod when running behind the
# Cloudflare Tunnel at https://cabal.dhyeytandel.in on a small home server.
#
# Network: bind to 127.0.0.1 only, because the only thing that talks to this process is the
# local cloudflared tunnel; nothing else on the machine or network should reach it directly.
# Shut down gracefully so an in-flight request finishes before the process exits.
server.address=127.0.0.1
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Thread and connection pools: this runs on a small home server, not a cluster, so pools are
# sized to stay light rather than to maximise throughput.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=50
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Serve compressed responses and let browsers cache static assets, since bandwidth and CPU
# are both scarcer here than on a normal deployment target.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/css,application/javascript
# Static files are revalidated on every load (a cheap 304 when unchanged) rather than
# cached for a fixed time, so a deploy never leaves visitors running old JavaScript
# against a new API.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=true

# The tunnel forwards client IP and scheme in headers; trust them so logs and redirects see
# the real request instead of the local loopback connection.
server.forward-headers-strategy=native

# Cosmetic and safety: no banner in production logs, a smaller rider cap so one plan cannot
# blow up response size or routing time on this hardware, and the write API key is mandatory
# (see ApiKeyFilter) since this is reachable from the public internet.
spring.main.banner-mode=off
routing.max-riders-per-plan=300
cabal.require-api-key=true
